name: OpenBridge checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest
      - name: Compile Python source
        run: python -m compileall -q server
      - name: Run tests
        run: pytest

  browser-extension-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate extension JavaScript syntax
        run: |
          node --check browser/extension/popup.js
          node --check browser/extension/background.js
          node --check browser/extension/content.js
      - name: Validate manifest and least-privilege permissions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("browser/extension")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          assert manifest["manifest_version"] == 3
          assert set(manifest.get("permissions", [])) == {"activeTab", "storage", "clipboardWrite"}
          assert manifest.get("host_permissions") == ["http://127.0.0.1:8767/*"]
          assert manifest["background"]["service_worker"] == "background.js"
          assert any("deepseek" in pattern for item in manifest["content_scripts"] for pattern in item["matches"])
          assert (root / manifest["action"]["default_popup"]).is_file()
          html = (root / manifest["action"]["default_popup"]).read_text(encoding="utf-8")
          assert 'src="popup.js"' in html
          assert (root / "popup.js").is_file()
          assert (root / "background.js").is_file()
          assert (root / "content.js").is_file()
          print("Browser extension manifest and local assets are valid.")
          PY

  godot-plugin-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Download pinned Godot 4 editor
        run: |
          curl -fsSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q godot.zip -d godot-bin
          chmod +x godot-bin/Godot_v4.4.1-stable_linux.x86_64
      - name: Import and parse the Godot smoke-test project
        env:
          GODOT_SILENCE_ROOT_WARNING: "1"
        run: |
          godot-bin/Godot_v4.4.1-stable_linux.x86_64 --headless --editor --path godot --quit
